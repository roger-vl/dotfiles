source-file ~/.config/tmux/tmux.reset.conf
set-option -g default-terminal 'screen-256color'
# set-option -g terminal-overrides ',xterm-256color:RGB'

set -g prefix C-o
set -g base-index 1              # start indexing windows at 1 instead of 0
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
set -g detach-on-destroy off  # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g default-terminal "${TERM}"
set -g allow-passthrough on
setw -g mode-keys vi
set -g extended-keys on
# set -s extended-keys on

# ── Mouse & scrolling ─────────────────────────────────────────
# Wheel scrolls history; drag-select copies to the system clipboard (tmux-yank)
set -g mouse on
# Gentler wheel: 3 lines per notch instead of the default 5
# bind -T copy-mode-vi WheelUpPane   send-keys -N3 -X scroll-up
# bind -T copy-mode-vi WheelDownPane send-keys -N3 -X scroll-down
# # Shift+PageUp enters copy-mode & pages up (no prefix needed).
# Inside copy-mode, PageUp/PageDown already page up/down by default.
# bind -n S-PageUp copy-mode -u
# prefix + Up / Down — line-by-line scroll (replaces default prefix-arrow
# pane-select, unused here since panes are navigated with h/j/k/l)
# bind Up   copy-mode \; send-keys -X scroll-up
# bind Down copy-mode \; send-keys -X scroll-down

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin '2kabhishek/tmux2k'
set -g @plugin 'omerxx/tmux-sessionx'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @resurrect-strategy-nvim 'session'
# set -g @continuum-restore 'on'

# Session
set -g @sessionx-bind 'C-e'
set -g @sessionx-prefix off
set -g @sessionx-preview-enabled 'true'
set -g @sessionx-git-branch 'on'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-ls-command 'lsd --tree --color=always --icon=always'
# set -g @sessionx-layout 'reverse'
set -g @sessionx-preview-ratio '35%'
set -g @sessionx-preview-location 'right'
set -g @sessionx-window-height '70%'
set -g @sessionx-window-width '60%'
set -g @sessionx-filtered-sessions 'claude'
set -g @sessionx-fzf-builtin-tmux 'on'

# session keys
set -g @sessionx-bind-select-down 'ctrl-n'
set -g @sessionx-bind-select-up 'ctrl-p'
set -g @sessionx-bind-scroll-up 'ctrl-k'
set -g @sessionx-bind-scroll-down 'ctrl-j'
set -g @sessionx-bind-kill-session 'ctrl-d'

# Status
set -g @tmux2k-theme 'gruvbox'
set -g @tmux2k-icons-only true
set -g @tmux2k-left-plugins "pcwd session"
set -g @tmux2k-right-plugins "git cpu ram"
set -g @tmux2k-cwd-min-depth 2
set -g @tmux2k-cwd-length 7
# pcwd: show ~/.../<parentDirectory>/...  (custom plugin: plugins/pcwd.sh)
# "black yellow" = blend with the bar background, yellow text
set -g @tmux2k-pcwd-colors "black yellow"
set -g window-status-current-format ""
set -g window-status-format ""
set -g status-position top



run '~/.tmux/plugins/tpm/tpm'
